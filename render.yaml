services:
  - type: web
    name: quant-portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: web
    name: quant-portfolio-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # The browser calls the API directly, so this must be the API's public
      # URL. Render's `fromService` host property resolves to the internal
      # private-network name, which does not resolve from a browser.
      - key: VITE_API_BASE
        value: https://quant-portfolio-api.onrender.com
